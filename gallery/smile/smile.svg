<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Animated Winking Smile v4</title>
  <desc id="desc">
    An animated drawing of a winking face with rosy cheeks that fade in and
    out. This version is more expressive and uses CSS animations.
  </desc>
  <style>
    :root {
      --face-stroke-color: black;
      --face-stroke-width: 2;
      --face-fill-color: none;
      --eyes-fill-color: black;
      --wink-stroke-color: black;
      --cheek-fill-color: #ffc0cb;
      --animation-duration: 2s;
    }
    .face {
      stroke: var(--face-stroke-color);
      stroke-width: var(--face-stroke-width);
      fill: var(--face-fill-color);
    }
    .eyes {
      fill: var(--eyes-fill-color);
    }
    .wink {
      stroke: var(--wink-stroke-color);
      stroke-width: var(--face-stroke-width);
      fill: none;
      animation: wink-animation var(--animation-duration) infinite;
    }
    .cheeks {
      fill: var(--cheek-fill-color);
      opacity: 0;
      animation: blush-animation var(--animation-duration) infinite;
    }
    @keyframes wink-animation {
      0%, 50%, 100% {
        d: path("M 125 75 C 130 85, 135 85, 140 75");
      }
      25% {
        d: path("M 125 80 C 130 80, 135 80, 140 80");
      }
    }
    @keyframes blush-animation {
      0%,
      100% {
        opacity: 0;
      }
      50% {
        opacity: 0.5;
      }
    }
  </style>
  <g>
    <circle class="face" cx="100" cy="100" r="90" />
    <circle class="eyes" cx="70" cy="80" r="5" />
    <path class="wink" d="M 125 75 C 130 85, 135 85, 140 75" />
    <path class="face" d="M 70 130 C 80 150, 120 150, 130 130" />
    <circle class="cheeks" cx="65" cy="110" r="15" />
    <circle class="cheeks" cx="135" cy="110" r="15" />
  </g>
</svg>
